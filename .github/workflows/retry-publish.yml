name: Retry Publish Signed APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag or version name (e.g. v2.3.5 or 2.3.5, empty for latest stable release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish_retry:
    runs-on: ubuntu-latest
    concurrency:
      group: android-production-release
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select stable release tag
        id: release_info
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_info.outputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Compare update manifest and prepare verified released APK
        id: distribution
        working-directory: release-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export RELEASE_COMMIT_SHA="$(git rev-parse HEAD)"
          python3 ../scripts/release_ci.py prepare-distribution

      - name: Publish signed APK to update server
        if: steps.distribution.outputs.should_deploy == 'true'
        working-directory: release-source
        shell: bash
        env:
          BP_UPDATE_SSH_KEY: ${{ secrets.BP_UPDATE_SSH_KEY }}
          BP_UPDATE_HOST_KEY: ${{ secrets.BP_UPDATE_HOST_KEY }}
          BP_UPDATE_HOST: ${{ secrets.BP_UPDATE_HOST }}
          BP_UPDATE_USER: ${{ secrets.BP_UPDATE_USER }}
        run: |
          set -euo pipefail

          test -n "${BP_UPDATE_SSH_KEY}" || { echo "::error::Missing secret BP_UPDATE_SSH_KEY (dedicated deploybp deploy key)."; exit 1; }
          test -n "${BP_UPDATE_HOST_KEY}" || { echo "::error::Missing secret BP_UPDATE_HOST_KEY (pinned SSH host key of the update server)."; exit 1; }
          test -n "${BP_UPDATE_HOST}" || { echo "::error::Missing secret BP_UPDATE_HOST (update server IP)."; exit 1; }
          test -n "${BP_UPDATE_USER}" || { echo "::error::Missing secret BP_UPDATE_USER (deploybp)."; exit 1; }

          APK="app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk"
          test -s "${APK}" || { echo "::error::Release APK not found: ${APK}"; exit 1; }

          SHA="$(sha256sum "${APK}" | cut -d' ' -f1)"
          NOTES_B64="$(base64 -w0 app/build/outputs/distribution-notes.txt)"

          SSH_DIR="${RUNNER_TEMP}/bp-deploy"
          mkdir -p "${SSH_DIR}" && chmod 700 "${SSH_DIR}"
          printf '%s\n' "${BP_UPDATE_SSH_KEY}" > "${SSH_DIR}/key" && chmod 600 "${SSH_DIR}/key"
          printf '%s\n' "${BP_UPDATE_HOST_KEY}" > "${SSH_DIR}/known_hosts"

          ssh -i "${SSH_DIR}/key" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="${SSH_DIR}/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "${BP_UPDATE_USER}@${BP_UPDATE_HOST}" \
              "publish --version ${VERSION_NAME} --version-code ${VERSION_CODE} --sha256 ${SHA} --releases-url ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG} --notes-b64 ${NOTES_B64} --file -" \
              < "${APK}"

          rm -f "${SSH_DIR}/key"
