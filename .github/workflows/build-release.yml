name: Android CI and Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to installing the legacy "tools" package,
          # which is no longer published and makes the action fail before Gradle runs.
          packages: ""
      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Validate release detection and recovery
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile app and run focused trend unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests '*TrendAggregationCalculatorTest' \
            --tests '*TrendSeriesCalculatorTest.everyRangeUsesSessionRepresentatives' \
            --tests '*TrendSeriesCalculatorTest.averagePulseIgnoresMissingValuesAndSessionPulseStaysNullable' \
            --tests '*TrendSeriesCalculatorTest.rangeFiltering_excludesOldAndFutureRecords' \
            --tests '*TrendViewModelTest' \
            --tests '*TrendChartMathTest.sharedSampling*' \
            --tests '*TrendChartMathTest.sampling*' \
            --tests '*TrendChartMathTest.pulseSampling*' \
            --tests '*TrendChartMathTest.nodeDensity*' \
            --tests '*TrendChartMathTest.dailyMode*' \
            --tests '*TrendChartMathTest.aggregationSwitch*' \
            --tests '*TrendChartMathTest.stableYAxis*' \
            --tests '*TrendChartMathTest.restoredViewport*' \
            --tests '*TrendChartMathTest.selectedBloodPressure*' \
            --tests '*TrendInsightCalculatorTest' \
            --tests '*AppReleaseNotesTest' --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-production-release
      cancel-in-progress: false
      # Keep all version pushes queued instead of replacing a pending release.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
      queue: max
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect new version or recover incomplete release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_ci.py detect
      - uses: actions/setup-java@v4
        if: steps.version.outputs.should_release == 'true'
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.should_release == 'true'
        with:
          # setup-android@v3 defaults to installing the legacy "tools" package,
          # which is no longer published and makes the action fail before Gradle runs.
          packages: ""
      - name: Install Android 16 SDK
        if: steps.version.outputs.should_release == 'true'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore release keystore
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty. Add it under Settings -> Secrets and variables -> Actions (base64 of keystore/blood-pressure-release.jks)."; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is empty. Add the keystore store password."; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "::error::Secret ANDROID_KEY_ALIAS is empty. Add the key alias (default: bloodpressure)."; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "::error::Secret ANDROID_KEY_PASSWORD is empty. Add the key password."; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks" || { echo "::error::Decoded keystore is empty; ANDROID_KEYSTORE_BASE64 may be invalid."; exit 1; }
      - name: Build signed Release APK and AAB
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          BP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          BP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab"
      - name: Restore packages from an interrupted release
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_ci.py restore-packages
      - name: Verify production signatures, version, alignment and checksums
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk" \
            | tee app/build/outputs/release-verification.txt
          # Public certificate fingerprint verified against the v2.2.2 Release APK.
          grep -qx 'Number of signers: 1' app/build/outputs/release-verification.txt
          grep -qi 'certificate SHA-256 digest: 46dfcbf4da054df8a8aca30e0df4df323161cbe4363a9eac7683a9da87d44012' \
            app/build/outputs/release-verification.txt
          "$(dirname "${APKSIGNER}")/aapt" dump badging \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk" \
            | grep '^package:' | tee -a app/build/outputs/release-verification.txt
          grep -F "package: name='com.yang.bloodpressure' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" \
            app/build/outputs/release-verification.txt
          jarsigner -verify \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab" \
            | tee -a app/build/outputs/release-verification.txt
          # jarsigner alone may exit successfully for an unsigned JAR. Read every
          # payload entry and require exactly the production signing certificate.
          java scripts/VerifyReleaseBundle.java \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab" \
            46dfcbf4da054df8a8aca30e0df4df323161cbe4363a9eac7683a9da87d44012 \
            | tee -a app/build/outputs/release-verification.txt
          "$(dirname "${APKSIGNER}")/zipalign" -c -P 16 -v 4 \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk" \
            | tee -a app/build/outputs/release-verification.txt
          sha256sum \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk" \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab" \
            > "app/build/outputs/release-sha256.txt"
          sha256sum --check app/build/outputs/release-sha256.txt
      - name: Upload signed Release packages
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blood-pressure-record-v${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.apk
            app/build/outputs/bundle/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.aab
            app/build/outputs/release-sha256.txt
            app/build/outputs/release-verification.txt
          if-no-files-found: error
      - name: Create tag and publish verified GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_ci.py publish
      - name: Remove restored keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
