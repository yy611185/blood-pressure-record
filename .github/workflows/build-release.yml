name: Android CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests, Lint and Debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[publish-release]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Resolve and verify release version
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          test -n "${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION_NAME}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"
      - name: Build and verify signed Release
        env:
          BP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          BP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk"
          jarsigner -verify \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab"
          sha256sum \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk" \
            "app/build/outputs/bundle/release/blood-pressure-record-v${VERSION_NAME}-release.aab" \
            > "app/build/outputs/release-sha256.txt"
      - name: Upload signed Release packages
        uses: actions/upload-artifact@v4
        with:
          name: blood-pressure-record-v${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.apk
            app/build/outputs/bundle/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.aab
            app/build/outputs/release-sha256.txt
          if-no-files-found: error
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.apk
            app/build/outputs/bundle/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.aab
            app/build/outputs/release-sha256.txt
