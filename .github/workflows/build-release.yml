name: Android CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests and Debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Verify tag matches app version
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          test "${GITHUB_REF_NAME}" = "v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
      - name: Build signed Release
        env:
          BP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          BP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/blood-pressure-record-v${VERSION_NAME}-release.apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-pressure-record-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/blood-pressure-record-v${{ env.VERSION_NAME }}-release.apk
