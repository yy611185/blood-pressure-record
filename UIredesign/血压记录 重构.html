<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>血压记录 · UI 重构 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="bp.css"/>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks_panel.jsx"></script>
<script type="text/babel" src="bp-common.jsx"></script>
<script type="text/babel" src="bp-home.jsx"></script>
<script type="text/babel" src="bp-record.jsx"></script>
<script type="text/babel" src="bp-history.jsx"></script>
<script type="text/babel" src="bp-trend.jsx"></script>
<script type="text/babel" src="bp-me.jsx"></script>
<script type="text/babel" src="bp-reminders.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 32,
  "dark": false,
  "bigText": false,
  "buddy": true,
  "skipRest": false,
  "strategy": "all",
  "scenario": "normal"
}/*EDITMODE-END*/;

// 演示场景：切换最近一次读数，用来检查分级边界 / 高风险 / 空状态
function scenarioData(kind) {
  const d = makeData();
  if (kind === 'empty') return [];
  const last = d[d.length - 1];
  const set = (groups) => { const a = averageOf(groups); Object.assign(last, { groups, s: a.s, d: a.d, p: a.p }); };
  if (kind === 'edge') set([{ s: 126, d: 56, p: 70 }, { s: 124, d: 54, p: 72 }]);       // 125/55 → 正常高值（原稿误判为偏低）
  if (kind === 'risk') set([{ s: 186, d: 104, p: 88 }, { s: 172, d: 98, p: 84 }]);      // 平均 179/101 是 2 级，但第 1 组 ≥180 → 高风险
  return d;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = useState(() => localStorage.getItem('bp_tab') || 'home');
  const [flow, setFlow] = useState(null); // null | { initial?: record }
  const [data, setData] = useState(() => scenarioData(t.scenario));
  const [meds, setMeds] = useState(MEDS_INIT);
  const [reminders, setReminders] = useState(REMINDERS_INIT);
  const [remOpen, setRemOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [scale, setScale] = useState(1);

  useEffect(() => { localStorage.setItem('bp_tab', tab); }, [tab]);
  useEffect(() => { setData(scenarioData(t.scenario)); }, [t.scenario]);
  useEffect(() => { document.documentElement.style.fontSize = t.bigText ? '18.5px' : '16px'; }, [t.bigText]);
  useEffect(() => {
    const fit = () => setScale(Math.min(1, (window.innerHeight - 40) / 898, (window.innerWidth - 30) / 426));
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, []);

  const toast = (m, action) => { setToastMsg(null); requestAnimationFrame(() => setToastMsg({ m, action, k: Date.now() })); };
  useEffect(() => { if (!toastMsg) return; const id = setTimeout(() => setToastMsg(null), toastMsg.action ? 5000 : 2200); return () => clearTimeout(id); }, [toastMsg]);

  const sortByTime = (arr) => arr.slice().sort((a, b) => a.t - b.t);
  const onSave = (rec, editing) => {
    setData((d) => sortByTime(editing ? d.map((r) => (r.id === rec.id ? rec : r)) : [...d, rec]));
  };
  const onDelete = (rec) => {
    setData((d) => d.filter((r) => r.id !== rec.id));
    toast('已删除 ' + rec.s + '/' + rec.d, { label: '撤销', run: () => { setData((d) => sortByTime([...d, rec])); setToastMsg(null); } });
  };

  const tabs = [['home', '首页', 'home'], ['history', '历史', 'cal'], null, ['trend', '趋势', 'trend'], ['me', '我的', 'me']];

  return (
    <>
      <div className={'phone' + (t.dark ? ' dark' : '')} style={{ '--ah': t.accentHue, transform: `scale(${scale})` }}>
        <StatusBar dark={t.dark} />
        {tab === 'home' && <HomeScreen key="h" data={data} meds={meds} setMeds={setMeds} onRecord={() => setFlow({})} go={setTab} buddyOn={t.buddy} toast={toast} />}
        {tab === 'history' && <HistoryScreen key="hi" data={data} onEdit={(r) => setFlow({ initial: r })} onDelete={onDelete} />}
        {tab === 'trend' && <TrendScreen key="t" data={data} />}
        {tab === 'me' && <MeScreen key="m" data={data} meds={meds} reminders={reminders} openReminders={() => setRemOpen(true)} dark={t.dark} setDark={(v) => setTweak('dark', v)} big={t.bigText} setBig={(v) => setTweak('bigText', v)} buddyOn={t.buddy} setBuddyOn={(v) => setTweak('buddy', v)} strategy={t.strategy} setStrategy={(v) => setTweak('strategy', v)} toast={toast} />}

        <nav className="tabbar" aria-label="主导航">
          {tabs.map((x, i) => x ? (
            <button key={x[0]} className={'tab' + (tab === x[0] ? ' on' : '')} aria-current={tab === x[0] ? 'page' : undefined} onClick={() => setTab(x[0])}>
              <Icon n={x[2]} sw={tab === x[0] ? 2.4 : 2} />{x[1]}
            </button>
          ) : (
            <button key="fab" className="fab" onClick={() => setFlow({})} aria-label="记一次血压"><Icon n="plus" sw={3} /></button>
          ))}
        </nav>

        {remOpen && <ReminderCenter value={reminders} meds={meds} onSave={setReminders} onClose={() => setRemOpen(false)} toast={toast} />}
        {flow && <RecordFlow key={flow.initial ? flow.initial.id : 'new'} initial={flow.initial} data={data} strategy={flow.initial ? flow.initial.strategy : t.strategy}
          onClose={(saved) => { const wasNew = !flow.initial; setFlow(null); if (saved && wasNew) setTab('home'); if (saved && !wasNew) toast('已更新这条记录'); }}
          onSave={onSave} buddyOn={t.buddy} skipRest={t.skipRest} />}
        {toastMsg && <div key={toastMsg.k} className={'toast' + (toastMsg.action ? ' has-act' : '')} role="status">
          <span>{toastMsg.m}</span>
          {toastMsg.action && <button className="act" onClick={toastMsg.action.run}>{toastMsg.action.label}</button>}
        </div>}
        <div className="home-ind" />
      </div>

      <TweaksPanel>
        <TweakSection label="演示场景">
          <TweakSelect label="最近一次读数" value={t.scenario} options={[
            { value: 'normal', label: '正常样例数据' },
            { value: 'edge', label: '边界：125/55（正常高值）' },
            { value: 'risk', label: '高风险：单组 ≥180' },
            { value: 'empty', label: '空数据（新用户）' },
          ]} onChange={(v) => setTweak('scenario', v)} />
        </TweakSection>
        <TweakSection label="品牌色">
          <TweakColor label="主色" value={`oklch(0.66 0.15 ${t.accentHue})`}
            options={['oklch(0.66 0.15 32)', 'oklch(0.66 0.15 5)', 'oklch(0.66 0.15 160)', 'oklch(0.66 0.15 260)']}
            onChange={(v) => setTweak('accentHue', +v.match(/ (\d+)\)$/)[1])} />
        </TweakSection>
        <TweakSection label="显示">
          <TweakToggle label="深色模式" value={t.dark} onChange={(v) => setTweak('dark', v)} />
          <TweakToggle label="大字模式（长辈）" value={t.bigText} onChange={(v) => setTweak('bigText', v)} />
          <TweakToggle label="显示吉祥物「小压」" value={t.buddy} onChange={(v) => setTweak('buddy', v)} />
        </TweakSection>
        <TweakSection label="录入流程">
          <TweakRadio label="平均策略" value={t.strategy} options={[{ value: 'all', label: '全部' }, { value: 'discardFirst', label: '弃第一组' }]} onChange={(v) => setTweak('strategy', v)} />
          <TweakToggle label="跳过静坐引导" value={t.skipRest} onChange={(v) => setTweak('skipRest', v)} />
          <TweakButton label="打开录入流程" onClick={() => setFlow({})} />
          <TweakButton label="打开提醒中心" secondary onClick={() => { setTab('me'); setRemOpen(true); }} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
